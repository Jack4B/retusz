name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build (folder)
        run: pyinstaller --noconfirm retusz.spec
      - name: Smoke test (headless CLI)
        shell: pwsh
        run: |
          python -c "from PIL import Image; import numpy as np; Image.fromarray((np.random.rand(600,900,3)*255).astype('uint8')).save('s.jpg'); Image.fromarray((np.random.rand(600,900,3)*200).astype('uint8')).save('r.jpg')"
          mkdir smoke; move s.jpg smoke\
          python -m retusz cli smoke --reference r.jpg --method ai_light
          python -c "import sys; sys.path.insert(0,'tests'); from synthetic import textured, grade, make_ai; from PIL import Image; o,_=textured(900,1350,seed=5); a,_=make_ai(grade(o),3); Image.fromarray(o).save('t_o.jpg'); Image.fromarray(a).save('t_ai.png')"
          python -m retusz transfer t_o.jpg t_ai.png
          if (!(Test-Path Retusz\t_o_grading-ai.jpg)) { throw "transfer smoke: brak wyniku" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Retusz\* -DestinationPath Retusz-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Retusz-windows-x64
          path: Retusz-windows-x64.zip
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Retusz-windows-x64.zip --title "Retusz ${{ github.ref_name }}" --notes "Paczka Windows x64. Rozpakuj i uruchom Retusz.exe. Model AI pobiera się przy pierwszym starcie (wydanie models-v1)."
