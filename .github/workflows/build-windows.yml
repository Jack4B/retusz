name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Rust tests & build (retusz-core, retusz-gpu, retusz-app)
        run: |
          cargo test --workspace --release
          cargo build --workspace --release
      - name: Python tests
        run: python -m pytest -q
      - name: Build application bundle (PyInstaller + Rust native engine binary)
        shell: pwsh
        run: |
          pyinstaller --noconfirm retusz.spec
          Copy-Item target\release\retusz-rs.exe dist\Retusz\Retusz-Studio-GPU.exe
      - name: Smoke test (headless CLI & AI grading transfer)
        shell: pwsh
        run: |
          python -c "from PIL import Image; import numpy as np; Image.fromarray((np.random.rand(600,900,3)*255).astype('uint8')).save('s.jpg'); Image.fromarray((np.random.rand(600,900,3)*200).astype('uint8')).save('r.jpg')"
          mkdir smoke; move s.jpg smoke\
          python -m retusz cli smoke --reference r.jpg --method ai_light
          .\dist\Retusz\Retusz-Studio-GPU.exe cli smoke --preset "Ciepły złoty" --out smoke_rs
          if (!(Test-Path smoke_rs\s_retusz.jpg)) { throw "rust cli smoke: brak wyniku" }
          python -c "import sys; sys.path.insert(0,'tests'); from synthetic import textured, grade, make_ai; from PIL import Image; o,_=textured(900,1350,seed=5); a,_=make_ai(grade(o),3); Image.fromarray(o).save('t_o.jpg'); Image.fromarray(a).save('t_ai.png')"
          python -m retusz transfer t_o.jpg t_ai.png
          if (!(Test-Path Retusz\t_o_grading-ai.jpg)) { throw "transfer smoke: brak wyniku" }
      - name: Build Windows Installer (Inno Setup -> Retusz-Setup-x64.exe)
        shell: pwsh
        run: |
          iscc installer\retusz.iss
          if (!(Test-Path dist\Retusz-Setup-x64.exe)) { throw "Inno Setup: brak instalatora Retusz-Setup-x64.exe" }
          Copy-Item dist\Retusz-Setup-x64.exe Retusz-Setup-x64.exe
      - name: Zip portable package
        shell: pwsh
        run: Compress-Archive -Path dist\Retusz\* -DestinationPath Retusz-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Retusz-windows-x64
          path: |
            Retusz-Setup-x64.exe
            Retusz-windows-x64.zip
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Retusz-Setup-x64.exe Retusz-windows-x64.zip --title "Retusz ${{ github.ref_name }}" --notes "Instalator Windows x64 (Retusz-Setup-x64.exe) oraz paczka portable (Retusz-windows-x64.zip, zawiera Retusz.exe oraz natywny edytor Rust+wgpu Retusz-Studio-GPU.exe). Model AI pobiera się przy pierwszym starcie (wydanie models-v1)."
